name: Resend lead delivery journal QA

on:
  pull_request:
    paths:
      - "src/lib/resend-delivery-webhook.ts"
      - "src/app/api/resend-webhook/route.ts"
      - "migrations/0001_lead_delivery_events.sql"
      - "tests/resend-delivery-webhook.spec.ts"
      - ".github/workflows/resend-delivery-journal-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lead-delivery-test:
    name: Signed webhook + replay-safe journal tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out changes
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Run isolated delivery tests (no browser or external mail)
        run: npx playwright test tests/resend-delivery-webhook.spec.ts --reporter=line
      - name: Type-check the project
        run: npx tsc --noEmit
